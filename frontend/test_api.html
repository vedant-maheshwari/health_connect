<!DOCTYPE html>
<html>

<head>
    <title>API Test - Appointments</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f5f5f5;
        }

        .result {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        pre {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }

        .error {
            color: #dc3545;
        }

        .success {
            color: #28a745;
        }
    </style>
</head>

<body>
    <h1>Appointments API Test</h1>
    <button onclick="testAPI()" style="padding: 10px 20px; font-size: 16px;">Test API</button>
    <div id="results"></div>

    <script>
        const API_BASE_URL = 'http://localhost:8080';

        async function testAPI() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="result">Loading...</div>';

            try {
                const token = sessionStorage.getItem('token');
                if (!token) {
                    results.innerHTML = '<div class="result error">❌ No token found. Please login via patient dashboard first.</div>';
                    return;
                }

                const res = await fetch(`${API_BASE_URL}/patient/appointments/detailed`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) {
                    results.innerHTML = `<div class="result error">❌ API Error: ${res.status} ${res.statusText}</div>`;
                    return;
                }

                const appointments = await res.json();

                let html = `<div class="result success">`;
                html += `<h2>✅ API Response (${appointments.length} appointments)</h2>`;
                html += `<pre>${JSON.stringify(appointments, null, 2)}</pre>`;

                html += `<h3>Summary:</h3><ul>`;
                appointments.forEach(apt => {
                    html += `<li><strong>ID ${apt.id}</strong>: ${apt.status_display} - Dr. ${apt.doctor_name} - ${apt.appointment_day} - Source: ${apt.booking_source || 'N/A'}</li>`;
                });
                html += `</ul></div>`;

                results.innerHTML = html;
            } catch (error) {
                results.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>

</html>
